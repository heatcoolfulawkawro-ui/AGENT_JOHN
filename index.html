<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Notatki</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#12181d; --panel:#1b232a; --panel2:#212b33; --line:#2c3841;
    --ink:#e8edf1; --ink-dim:#8fa0ab; --amber:#e8a33d; --green:#4caf7d;
    --red:#d9695f; --blue:#5b9bd5; --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Segoe UI',Roboto,Arial,sans-serif; }

  header.app{ position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#151c22 0%, #12181d 100%); border-bottom:1px solid var(--line); padding:14px 16px 0; }
  header.app .toprow{ display:flex; align-items:center; gap:8px; padding-bottom:12px; }
  header.app .exitbtn{ background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim); font-size:12px; font-family:inherit; padding:7px 11px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:5px; flex-shrink:0; }
  header.app .titles{ min-width:0; }
  header.app h2{ margin:0; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px; }
  header.app h2 .lock{ font-size:11px; }
  header.app .crumb{ color:var(--ink-dim); font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header.app h2.plain{ font-size:16px; }
  header.app .hsub{ color:var(--ink-dim); font-size:11.5px; padding-bottom:12px; margin-top:-4px; }

  .worktabs{ display:flex; gap:2px; margin:0 -16px; padding:0 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  .worktabs button{ flex:1; background:none; border:none; color:var(--ink-dim); font-family:inherit; font-size:13px; font-weight:600; padding:11px 4px; cursor:pointer; border-bottom:2px solid transparent; display:flex; align-items:center; justify-content:center; gap:6px; }
  .worktabs button.on{ color:var(--amber); border-bottom-color:var(--amber); }
  .cbadge{ background:var(--panel2); color:var(--ink-dim); font-size:10.5px; font-weight:700; border-radius:9px; padding:1px 6px; }
  .worktabs button.on .cbadge{ background:var(--amber); color:#20140a; }

  main.app{ padding:14px 16px 22px; }
  main.app.haswb{ padding-bottom:82px; }
  main.app.hastb{ padding-bottom:76px; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:5px; }
  .field input, .field textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:11px 12px; color:var(--ink); font-size:15px; font-family:inherit;
  }
  .field textarea{ resize:none; min-height:56px; }
  .field.ai input{ border-color:#4a3a1c; background:#1c1811; }
  .ailabel{ display:inline-flex; align-items:center; gap:4px; color:var(--amber); font-size:10.5px; margin-left:6px; font-weight:600; }

  .bigcta{
    width:100%; background:var(--amber); color:#20140a; border:none; border-radius:11px;
    padding:14px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .bigcta:disabled{ opacity:.6; }
  .ghostbtn{
    width:100%; background:none; border:1px dashed var(--line); color:var(--ink-dim); border-radius:9px;
    padding:11px; font-size:13px; font-family:inherit; cursor:pointer; margin-top:8px;
  }

  .sectionlbl{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.07em; margin:4px 0 8px; display:flex; align-items:center; justify-content:space-between; }
  .sectionlbl a{ color:var(--amber); text-decoration:none; font-weight:700; text-transform:none; letter-spacing:0; font-size:12.5px; cursor:pointer; }

  .visitcard{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; cursor:pointer; }
  .visitcard .dot{ width:8px; height:8px; border-radius:50%; background:var(--amber); flex-shrink:0; }
  .visitcard.done .dot{ background:var(--green); }
  .visitcard .main{ flex:1; min-width:0; }
  .visitcard .name{ font-size:14px; font-weight:600; }
  .visitcard .sub{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; }
  .visitcard .chev{ color:var(--ink-dim); flex-shrink:0; font-size:16px; }

  .addbox{ background:var(--panel2); border:1px dashed var(--line); border-radius:var(--radius); padding:13px; margin-bottom:10px; }
  .addbox .field{ margin-bottom:9px; }
  .addbox .field input{ background:var(--panel); }

  .shotbox{ background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center; margin-bottom:14px; }
  .shotpickrow{ display:flex; gap:8px; margin-bottom:10px; }
  .shotpickrow button{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:12.5px; font-weight:600; border-radius:9px; padding:13px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .shotpickrow button span.ic{ font-size:20px; }
  .shotbox p{ margin:0; font-size:11.5px; color:var(--ink-dim); }

  .thumbrow{ display:flex; gap:10px; align-items:center; background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:12px; }
  .thumb{ width:56px; height:56px; border-radius:7px; background:linear-gradient(135deg,#2a3540,#1a232b); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:19px; overflow:hidden; text-decoration:none; border:none; padding:0; font-family:inherit; cursor:pointer; }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .scanstate{ font-size:13px; color:var(--amber); display:flex; align-items:center; gap:8px; }
  .dot3{ display:inline-flex; gap:3px; }
  .dot3 span{ width:4px; height:4px; border-radius:50%; background:var(--amber); animation:pulse 1.2s infinite ease-in-out; }
  .dot3 span:nth-child(2){ animation-delay:.15s; } .dot3 span:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.25} 40%{opacity:1} }

  .counterbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; gap:8px; }
  .counterbar .cnt{ font-size:13.5px; font-weight:700; }
  .counterbar .cnt b{ color:var(--amber); }
  .counterbar .sync{ font-size:10.5px; color:var(--ink-dim); display:flex; align-items:center; gap:5px; flex-shrink:0; white-space:nowrap; }
  .syncdot{ width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; }
  .sorthint{ font-size:11px; color:var(--ink-dim); margin:0 0 12px; }

  .devcard{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:8px; display:flex; gap:9px; align-items:center; }
  .devcard .reorder{ display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .devcard .reorder button{ background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim); width:22px; height:19px; font-size:10px; line-height:1; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; }
  .devcard .reorder button:first-child{ border-radius:5px 5px 0 0; }
  .devcard .reorder button:last-child{ border-radius:0 0 5px 5px; border-top:none; }
  .devcard .reorder button:disabled{ opacity:.3; }
  .devcard .thumb{ width:46px; height:46px; font-size:16px; }
  .devcard .body{ flex:1; min-width:0; }
  .devcard .title{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .devcard .meta{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .uwagiline{ font-size:11.5px; color:var(--amber); margin-top:4px; line-height:1.4; white-space:normal; word-break:break-word; }
  .pairline{ font-size:11.5px; color:var(--blue); margin-top:4px; line-height:1.4; white-space:normal; word-break:break-word; }
  .tag{ display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:10px; color:var(--ink-dim); margin-top:4px; }
  .tag.out{ color:var(--blue); border-color:#2a4256; }
  .devcard .acts{ display:flex; flex-direction:column; gap:5px; flex-shrink:0; }
  .devcard .acts button{
    background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim);
    font-size:15px; cursor:pointer; padding:0; width:34px; height:24px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
  }
  .devcard .acts button.dup{ color:var(--blue); border-color:#2a4256; }
  .devcard .acts button.del{ color:var(--red); border-color:#4a2c28; }

  .finishcard{ background:#152018; border:1px solid #2c4536; border-radius:var(--radius); padding:14px; margin:16px 0 4px; text-align:center; }
  .finishcard p{ margin:0 0 10px; font-size:12.5px; color:var(--ink-dim); line-height:1.5; }
  .finishbtn{ width:100%; background:none; border:1px solid var(--green); color:var(--green); border-radius:9px; padding:12px; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; }

  .bottombar{ position:fixed; left:0; right:0; bottom:0; background:#151c22; border-top:1px solid var(--line); padding:10px 14px 14px; display:flex; gap:6px; z-index:6; }
  .bottombar button{ font-family:inherit; cursor:pointer; border-radius:10px; font-size:12.5px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:9px 4px; }
  .bottombar .secondary{ background:var(--panel2); border:1px solid var(--line); color:var(--ink); flex:0 0 66px; }
  .bottombar .dl{ background:var(--panel2); border:1px solid var(--line); color:var(--ink); flex:1; }
  .bottombar .share{ background:var(--amber); color:#20140a; flex:1.3; }

  .tabbar{ position:fixed; left:0; right:0; bottom:0; display:flex; background:#151c22; border-top:1px solid var(--line); z-index:6; }
  .tabbar button{ flex:1; background:none; border:none; color:var(--ink-dim); font-family:inherit; padding:10px 4px 10px; font-size:11.5px; font-weight:600; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tabbar button .ic{ font-size:17px; }
  .tabbar button.active{ color:var(--amber); }

  .err{ color:var(--red); font-size:12px; margin:0 0 10px; background:#2a1614; border:1px solid #4a2c28; border-radius:8px; padding:9px 11px; }
  .empty{ color:var(--ink-dim); font-size:13px; text-align:center; padding:26px 10px; }

  .toast{ position:fixed; top:14px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--bg); background:var(--green); padding:8px 15px; border-radius:9px; z-index:50; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s; max-width:88vw; text-align:center; box-shadow:0 8px 20px -6px #000a; }
  .toast.show{ opacity:1; }
  .toast.err{ background:var(--red); color:#2a1210; }

  .lightbox{ position:fixed; inset:0; background:rgba(6,9,11,.94); z-index:60; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:100%; max-height:78vh; object-fit:contain; border-radius:8px; touch-action:pinch-zoom; }
  .lbclose{ position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); color:var(--ink); font-size:18px; cursor:pointer; }
  .lbopen{ margin-top:14px; color:var(--amber); font-size:12.5px; text-decoration:none; }

  .folderpath{ font-size:10.5px; color:var(--ink-dim); margin:2px 0 12px; word-break:break-word; }

  .typfieldwrap .typegrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .typcol{ background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px; display:flex; flex-direction:column; gap:5px; }
  .typcolhead{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); text-align:center; margin-bottom:2px; }
  .typcolhead.zew{ color:var(--blue); }
  .typebtn{ background:var(--panel); border:1px solid var(--line); color:var(--ink-dim); border-radius:7px; padding:9px 4px; font-size:12.5px; font-family:inherit; cursor:pointer; }
  .typebtn.sel{ background:#1b2e22; border-color:var(--green); color:var(--green); font-weight:600; }
  .typcol:has(.typcolhead.zew) .typebtn.sel{ background:#152230; border-color:var(--blue); color:var(--blue); }
  .typeinne{ width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim); border-radius:8px; padding:9px; font-size:12.5px; font-family:inherit; cursor:pointer; }
  .typeinne.sel{ background:#1b2e22; border-color:var(--green); color:var(--green); font-weight:600; }

  .delvisit{ background:none; border:none; color:var(--red); font-size:15px; cursor:pointer; padding:6px; flex-shrink:0; }

  .extragrid{ display:flex; flex-wrap:wrap; gap:8px; }
  .extrathumb{ position:relative; width:64px; height:64px; }
  .extrathumb .thumb{ width:64px; height:64px; }
  .extradel{ position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--red); border:2px solid var(--bg); color:#fff; font-size:11px; line-height:1; cursor:pointer; padding:0; }
  .extrapending{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45); color:var(--amber); font-size:16px; }
  .extraadd{ width:64px; height:64px; border-radius:7px; background:none; border:1px dashed var(--line); color:var(--ink-dim); font-size:22px; font-family:inherit; cursor:pointer; }

  .co2live{ margin-bottom:4px; }
  .co2info{ font-size:11.5px; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; line-height:1.6; margin-top:6px; }
  .co2dim{ color:var(--ink-dim); }
  .co2warn{ color:var(--amber); }
  .cro-yes{ color:var(--red); font-weight:700; }
  .cro-no{ color:var(--green); font-weight:700; }
  .co2hint{ font-size:10.5px; color:var(--ink-dim); line-height:1.5; margin:6px 0 14px; }

  .paircard{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 13px; margin-bottom:10px; }
  .pairhead{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .pairhead .dot{ width:8px; height:8px; border-radius:50%; background:var(--blue); flex-shrink:0; }
  .pairname{ font-size:13.5px; font-weight:600; }
  .pairempty{ font-size:11.5px; color:var(--ink-dim); padding:4px 0 2px 16px; }
  .pairchild{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0 8px 16px; border-top:1px dashed var(--line); }
  .pairchild:first-of-type{ border-top:none; }
  .pairchild.unassigned{ padding:10px 12px; border-top:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:7px; }
  .pcname{ font-size:12.5px; }
  .pcbtn{ background:var(--panel2); border:1px solid var(--line); color:var(--amber); border-radius:7px; padding:6px 10px; font-size:11.5px; font-family:inherit; cursor:pointer; flex-shrink:0; }
  .pcunlink{ background:none; border:1px solid #4a2c28; color:var(--red); border-radius:7px; width:30px; height:30px; font-size:13px; font-family:inherit; cursor:pointer; flex-shrink:0; }

  .pairmodal{ position:fixed; inset:0; background:rgba(6,9,11,.85); z-index:55; display:none; align-items:flex-end; justify-content:center; }
  .pairmodal.show{ display:flex; }
  .pairmodalbox{ width:100%; max-width:480px; background:var(--panel); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:16px; max-height:70vh; overflow-y:auto; }
  .pairmodaltitle{ font-size:13.5px; font-weight:700; margin-bottom:10px; }
  .pairoption{ display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:11px 12px; font-size:13px; font-family:inherit; cursor:pointer; margin-bottom:7px; }
  .pairoption.sel{ border-color:var(--green); color:var(--green); }
  .pairoption.unassign{ color:var(--red); }
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div id="app"></div>

<div class="lightbox" id="lightbox">
  <button class="lbclose" id="lbClose" type="button">✕</button>
  <img id="lbImg" src="" alt="">
  <a class="lbopen" id="lbOpenExt" target="_blank" rel="noopener">Otwórz w nowej karcie ↗</a>
</div>

<div class="pairmodal" id="pairModal">
  <div class="pairmodalbox">
    <div class="pairmodaltitle" id="pairModalTitle"></div>
    <div id="pairModalList"></div>
    <button type="button" class="ghostbtn" id="pairModalCancel">Anuluj</button>
  </div>
</div>

<div class="lightbox" id="treeExportModal">
  <button class="lbclose" id="treeExportClose" type="button">✕</button>
  <img id="treeImg" src="" alt="" style="background:#fff;border-radius:8px;">
  <div style="display:flex;gap:8px;margin-top:14px;width:100%;max-width:320px">
    <button type="button" id="treeDownloadBtn" class="ghostbtn" style="margin-top:0;flex:1">⬇ Pobierz</button>
    <button type="button" id="treeShareBtn" class="ghostbtn" style="margin-top:0;flex:1;color:var(--amber);border-color:#4a3a1c">↗ Udostępnij</button>
  </div>
</div>

<script>
// ============ KONFIGURACJA ============
// Paweł: podmień poniższy URL na ten z Twojego wdrożenia Apps Script (kończy się na /exec).
const GAS_URL = 'https://script.google.com/macros/s/AKfycbycVXhSo0XNEVoU16TQMjocODMWnBZj3fB8tzhhydNWje5K3S84dYpreQVNktd9tuNU/exec';
const TOKEN = 'hvac_580gMoLePXK8REU7k8KfTyG5';

// ============ POMOCNICZE ============
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function val(id){ const el=document.getElementById(id); return el ? el.value : ''; }
function isLocalOnlyId(id){ return String(id).indexOf('local_')===0; }
const TYP_GROUPS = [
  { key:'split', label:'Split' },
  { key:'multi', label:'Multi' },
  { key:'vrf', label:'VRF' }
];
function typLabel(t){
  if(!t) return '';
  if(t==='inne') return 'Inne';
  if(t==='wewnetrzna') return 'Wewnętrzna'; // wpisy sprzed rozszerzenia typów
  if(t==='zewnetrzna') return 'Zewnętrzna'; // wpisy sprzed rozszerzenia typów
  const m = /^(split|multi|vrf)_(wew|zew)$/.exec(t);
  if(m){
    const grp = TYP_GROUPS.find(g => g.key===m[1]);
    return (grp ? grp.label : m[1]) + ' ' + (m[2]==='wew' ? 'Wew.' : 'Zew.');
  }
  return t;
}
function isZewTyp(t){ return t==='zewnetrzna' || /_zew$/.test(t||''); }
function usesSystemTag(t){ return /^(multi|vrf)_/.test(t||''); }

// ============ CZYNNIK CHŁODNICZY: GWP / CO2e / próg CRO ============
// Wartości GWP wg IPCC AR4 (100-letni horyzont) — to jest podstawa prawna
// używana w Rozporządzeniu UE 2024/573 (Załącznik I) do liczenia ekwiwalentu
// CO2, NIE nowsze wartości AR5/AR6 które krążą w internecie. Jeśli brakuje
// czynnika którego używacie, dopisz go tutaj (sam wpis w tabeli poniżej
// wystarczy, reszta appki obsłuży go automatycznie).
const GWP_TABLE = {
  'R32': 675, 'R410A': 2088, 'R404A': 3922, 'R407A': 2107, 'R407C': 1774,
  'R407F': 1824, 'R134A': 1430, 'R290': 3, 'R454B': 466, 'R448A': 1387,
  'R449A': 1397, 'R507A': 3985, 'R422D': 2729, 'R1234YF': 4, 'R1234ZE': 7
};
// Próg rejestracji w Centralnym Rejestrze Operatorów (Rozp. UE 2024/573 +
// Ustawa o f-gazach): 5 t CO2e dla urządzeń NIEhermetycznych (czyli m.in.
// split/multi/VRF z instalacją łączoną w terenie — to jest zdecydowana
// większość tego, co ten program obsługuje), 10 t CO2e dla urządzeń
// fabrycznie hermetycznie zamkniętych. Appka zakłada niehermetyczne — jeśli
// trafi się faktycznie hermetyczne urządzenie, to ocena progu wymaga
// Twojej weryfikacji, appka tego automatycznie nie rozpozna.
const CRO_PROG_TCO2E = 5;

function normalizeCzynnik(s){ return String(s||'').trim().toUpperCase().replace(/[\s-]+/g,''); }
function gwpFor(czynnik){
  const key = normalizeCzynnik(czynnik);
  return Object.prototype.hasOwnProperty.call(GWP_TABLE, key) ? GWP_TABLE[key] : null;
}
function czynnikSumaKg(u){
  const fab = parseFloat(u.czynnikFabryczny);
  const dod = parseFloat(u.czynnikDodatkowy);
  const fabOk = !isNaN(fab) ? fab : 0;
  const dodOk = !isNaN(dod) ? dod : 0;
  return fabOk + dodOk;
}
function co2eqInfo(u){
  const suma = czynnikSumaKg(u);
  if(!suma || !u.czynnik) return null;
  const gwp = gwpFor(u.czynnik);
  const dodBrak = isNaN(parseFloat(u.czynnikDodatkowy));
  if(gwp == null) return { suma, dodBrak, gwp:null, tco2e:null, cro:null };
  const tco2e = suma * gwp / 1000;
  return { suma, dodBrak, gwp, tco2e, cro: tco2e >= CRO_PROG_TCO2E };
}
function co2eqBadgeHtml(u){
  const info = co2eqInfo(u);
  if(!info) return '';
  const kgTxt = String(parseFloat(info.suma.toFixed(2))) + ' kg';
  const dodNote = info.dodBrak ? ' <span class="co2dim">(bez ilości dodatkowej)</span>' : '';
  if(info.gwp == null){
    return '<div class="co2info"><span class="co2warn">⚠ "' + esc(u.czynnik) + '" — nieznane GWP, dopisz czynnik w kodzie appki. Suma: ' + kgTxt + dodNote + '</span></div>';
  }
  const croClass = info.cro ? 'cro-yes' : 'cro-no';
  const croTxt = info.cro ? 'W CRO' : 'Poza CRO';
  return '<div class="co2info">' + esc(normalizeCzynnik(u.czynnik)) + ' · ' + kgTxt + dodNote +
    ' · ' + info.tco2e.toFixed(2) + ' t CO₂-eq · <span class="' + croClass + '">' + croTxt + '</span></div>';
}
function pad2(n){ return ('0'+n).slice(-2); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear();
}
function fmtRelative(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const now = new Date();
  const hm = pad2(d.getHours())+':'+pad2(d.getMinutes());
  if(d.toDateString()===now.toDateString()) return 'dziś ' + hm;
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(d.toDateString()===yest.toDateString()) return 'wczoraj ' + hm;
  return fmtDate(iso);
}
function todayLabel(){ return fmtDate(new Date().toISOString()); }
function fmtDateISO(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function folderPathLabel(){

async function setParowanie(indoorId, outdoorId){
  const i = state.urzadzenia.findIndex(u => u.id === indoorId);
  if(i < 0) return;
  const updated = Object.assign({}, state.urzadzenia[i], { parujZId: outdoorId || '' });
  // Jeśli to urządzenie czeka jeszcze na swoją pierwszą synchronizację, dopisz
  // parowanie też do _payload — inaczej ta pierwsza synchronizacja wyśle stary
  // payload (sprzed sparowania) i nadpisze to, co przed chwilą ustawiliśmy.
  if(updated._payload) updated._payload = Object.assign({}, updated._payload, { parujZId: outdoorId || '' });
  state.urzadzenia[i] = updated;
  persistLocalUrzadzenia();
  render();
  if(isLocalOnlyId(indoorId)){
    showToast('Zapisano lokalnie — dopnie się przy najbliższej synchronizacji', true);
    return;

  try{
    const res = await apiPost({action:'update_urzadzenie', id: indoorId, parujZId: outdoorId || ''});
    if(!res.ok) throw new Error(res.error || 'Błąd');
    showToast('zapisano przypisanie');
  }catch(err){
    showToast('Nie udało się zapisać przypisania: ' + err.message, true);
  }
}

// ============ ZDJĘCIE: wczytanie + zmniejszenie ============
function fileToDownscaledBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('nie udało się odczytać pliku'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('nie udało się odczytać zdjęcia'));
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', previewDataUrl: dataUrl });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Zegar przy "Analizuję zdjęcie" — nie triggeruje pełnego render() (żeby nic
// nie migało co sekundę), tylko dopisuje sekundy bezpośrednio do DOM-u. Przydaje
// się też diagnostycznie: jak odczyt znów będzie wolny, Paweł zobaczy dokładną
// liczbę sekund zamiast "kilku minut z pamięci".
let analyzeTimerHandle = null;
function startAnalyzeTimer(){
  const t0 = Date.now();
  clearInterval(analyzeTimerHandle);
  analyzeTimerHandle = setInterval(() => {
    const el = document.getElementById('analyzeTimerText');
    if(el) el.textContent = Math.round((Date.now() - t0) / 1000) + 's';
  }, 500);
}
function stopAnalyzeTimer(){
  clearInterval(analyzeTimerHandle);
  analyzeTimerHandle = null;
}

// Twardy limit czasu na odczyt AI — słaby zasięg w terenie (piwnice, dachy,
// maszynownie) albo przeciążony model nie mogą już zawiesić appki na kilka
// minut: po ANALYZE_TIMEOUT_MS przerywamy i wracamy do ręcznego wpisywania.
const ANALYZE_TIMEOUT_MS = 20000;

async function onPhotoChosen(file){
  if(!file) return;
  try{
    const picked = await fileToDownscaledBase64(file);
    formPhoto = picked;
    formExistingPhotoUrl = null;
    formAiFilled = false;
    analyzeError = '';
    analyzing = true;
    render();
    startAnalyzeTimer();
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), ANALYZE_TIMEOUT_MS);
    try{
      const res = await apiPost({ action:'analyze_photo', imageBase64: picked.base64, mimeType: picked.mimeType }, controller.signal);
      if(res.ok){
        state.form.producent = res.data.producent || '';
        state.form.model = res.data.model || '';
        state.form.sn = res.data.sn || '';
        state.form.czynnik = res.data.czynnik || '';
        // na wypadek gdyby model zwrócił przecinek zamiast kropki mimo instrukcji —
        // pole liczbowe (type=number) po prostu zignoruje wartość z przecinkiem.
        state.form.czynnikFabryczny = String(res.data.czynnikFabryczny || '').trim().replace(',', '.');
        formAiFilled = true;
      } else {
        analyzeError = res.error || 'Nie udało się odczytać zdjęcia automatycznie — wpisz dane ręcznie.';
      }
    }catch(err){
      if(err.name === 'AbortError'){
        analyzeError = 'Odczyt AI trwał za długo (>20s, pewnie słaby zasięg) — przerwano. Wpisz dane ręcznie, zdjęcie i tak się zapisze.';
      } else {
        analyzeError = 'Brak połączenia — wpisz dane ręcznie (zdjęcie zostanie zapisane).';
      }
    }
    clearTimeout(timeoutId);
    stopAnalyzeTimer();
    analyzing = false;
    render();
  }catch(err){
    stopAnalyzeTimer();
    showToast('Nie udało się wczytać zdjęcia: ' + err.message, true);
  }
}

    syncExtraPhotosToState();

// ============ SYNCHRONIZACJA WPISÓW ============
function buildRetryQueue(){ return state.urzadzenia.filter(u => u._synced === false); }

async function trySyncEntry(id, payload){
  const isEdit = !isLocalOnlyId(id);
  try{
    const res = isEdit
      ? await apiPost(Object.assign({action:'update_urzadzenie', id: id}, payload))
      : await apiPost(Object.assign({action:'add_urzadzenie'}, payload));
    if(!res.ok) throw new Error(res.error || 'Błąd zapisu');
    const i = state.urzadzenia.findIndex(u => u.id === id);
    if(i > -1){
      const localPreview = state.urzadzenia[i]._localPreview;
      const merged = Object.assign({}, res.data, { _synced: true });
      if(!merged.zdjecieUrl && localPreview) merged._localPreview = localPreview;
      state.urzadzenia[i] = merged;
      // Nowe urządzenie dostaje przy pierwszej synchronizacji prawdziwe ID
      // zamiast lokalnego (local_...). Jeśli coś inne było już z nim sparowane
      // (przez to stare lokalne ID), tę referencję trzeba przepisać na nowe —
      // inaczej parowanie zostaje wskazujące donikąd.
      if(!isEdit && merged.id !== id) await migrateParujZIdRefs(id, merged.id);
    }
    persistLocalUrzadzenia();
    showToast('zsynchronizowano');
  }catch(err){
    showToast('Brak połączenia — zapisano lokalnie, spróbuję ponownie', true);
  }
  render();
}

async function migrateParujZIdRefs(oldId, newId){
  const affected = state.urzadzenia.filter(u => u.parujZId === oldId);
  for(const u of affected){
    const i = state.urzadzenia.findIndex(x => x.id === u.id);
    if(i < 0) continue;
    const updated = Object.assign({}, state.urzadzenia[i], { parujZId: newId });
    if(updated._payload) updated._payload = Object.assign({}, updated._payload, { parujZId: newId });
    state.urzadzenia[i] = updated;
    if(!isLocalOnlyId(u.id)){
      // Ten wpis już wcześniej zsynchronizowany — poprawka musi jeszcze
      // dogonić serwer, inaczej w arkuszu zostanie martwe ID.
      try{ await apiPost({action:'update_urzadzenie', id: u.id, parujZId: newId}); }
      catch(e){ /* dogoni przy najbliższej ogólnej synchronizacji tego wpisu */ }
    }
  }
}

async function retryAllUnsynced(){
  const queue = buildRetryQueue();
  if(!queue.length) return;
  showToast('Synchronizuję ' + queue.length + '…');
  for(const u of queue){
    await trySyncEntry(u.id, u._payload);
  }
}

async function submitForm(){
  const producent = val('inpProducent').trim();
  const model = val('inpModel').trim();
  const sn = val('inpSN').trim();
  const lokalizacja = val('inpLokalizacja').trim();
  const uwagi = val('inpUwagi').trim();
  const system = val('inpSystem').trim();
  const czynnik = val('inpCzynnik').trim();
  const czynnikFabryczny = val('inpCzynnikFab').trim();
  const czynnikDodatkowy = val('inpCzynnikDod').trim();
  const errEl = document.getElementById('formErr');

  if(!lokalizacja){
    if(errEl){ errEl.textContent = 'Podaj lokalizację (np. numer pomieszczenia) — po niej porządkujemy zdjęcia i listę.'; errEl.style.display = 'block'; }
    return;
  }
  if(errEl) errEl.style.display = 'none';

  const payload = { wizytaId: state.currentWizyta.id, producent, model, sn, typ: formTyp, system, lokalizacja, uwagi, czynnik, czynnikFabryczny, czynnikDodatkowy };
  if(formPhoto){ payload.imageBase64 = formPhoto.base64; payload.mimeType = formPhoto.mimeType; }
  // Tylko nowo wybrane zdjęcie ma sens jako _localPreview (surowy data: URL, renderowalny
  // w <img>). formExistingPhotoUrl bywa linkiem do strony podglądu Drive — nieużywalnym
  // jako src obrazka — więc go tu celowo pomijamy; miniatura i tak spadnie na zdjecieFileId.
  const localPreview = formPhoto ? formPhoto.previewDataUrl : null;

  const idBeingEdited = editingId;
  let entryId;
  if(idBeingEdited){
    entryId = idBeingEdited;
    const i = state.urzadzenia.findIndex(u => u.id === idBeingEdited);
    if(i > -1){
      // Jawnie dopisujemy bieżące parujZId — samo poleganie na "brak pola w
      // payloadzie = serwer go nie rusza" raz doprowadziło do zgubienia
      // parowania przy zwykłej edycji SN. Ta wersja jest odporna niezależnie
      // od przyczyny tamtego przypadku.
      payload.parujZId = state.urzadzenia[i].parujZId || '';
      state.urzadzenia[i] = Object.assign({}, state.urzadzenia[i], payload, {
        _synced: false, _payload: payload,
        _localPreview: localPreview || state.urzadzenia[i]._localPreview
      });
    }
  } else {
    entryId = 'local_' + Date.now() + '_' + Math.floor(Math.random() * 9999);
    // clientId jedzie do serwera razem z resztą payloadu — pozwala backendowi
    // rozpoznać, że dwie próby zapisu (np. auto-sync przy otwarciu wizyty
    // nałożony na sync tuż po dodaniu) to to samo urządzenie, nie duplikat.
    payload.clientId = entryId;
    state.urzadzenia.push(Object.assign({ id: entryId }, payload, {
      _synced: false, _payload: payload, _localPreview: localPreview
    }));
  }
  persistLocalUrzadzenia();
  resetForm();
  if(idBeingEdited) state.workTab = 'lista';
  render();
  if(!idBeingEdited) showToast('dodano do listy');
  await trySyncEntry(entryId, payload);
}

function startEdit(id){
  const u = state.urzadzenia.find(x => x.id === id);
  if(!u) return;
  editingId = id;
  formTyp = u.typ || 'wewnetrzna';
  formPhoto = null;
  // zdjecieUrl to link do strony podglądu Drive, nie do surowego obrazka — do <img>
  // trzeba wersji miniaturowej po fileId; dla jeszcze nie zsynchronizowanego zdjęcia
  // jedyne co mamy to lokalny podgląd.
  formExistingPhotoUrl = u.zdjecieFileId ? driveThumbUrl(u.zdjecieFileId, 600) : (u._localPreview || null);
  formAiFilled = false;
  analyzeError = '';
  editingExtraPhotos = (u.zdjeciaDodatkowe || []).slice();
  state.form = { producent: u.producent||'', model: u.model||'', sn: u.sn||'', lokalizacja: u.lokalizacja||'', uwagi: u.uwagi||'', system: u.system||'',
    czynnik: u.czynnik||'', czynnikFabryczny: u.czynnikFabryczny||'', czynnikDodatkowy: u.czynnikDodatkowy||'' };
  state.workTab = 'dodaj';
  render();
}

function duplicateEntry(id){
  const u = state.urzadzenia.find(x => x.id === id);
  if(!u) return;
  editingId = null;
  formTyp = u.typ || 'wewnetrzna';
  formPhoto = null;
  formExistingPhotoUrl = null;
  formAiFilled = false;
  analyzeError = '';
  editingExtraPhotos = [];
  state.form = { producent: u.producent||'', model: u.model||'', sn: '', lokalizacja: u.lokalizacja||'', uwagi: u.uwagi||'', system: u.system||'',
    czynnik: u.czynnik||'', czynnikFabryczny: u.czynnikFabryczny||'', czynnikDodatkowy:'' };
  state.workTab = 'dodaj';
  render();
  showToast('skopiowano — zeskanuj nową tabliczkę albo popraw dane');
}

async function deleteEntry(id){
  const u = state.urzadzenia.find(x => x.id === id);
  if(!u) return;
  const opis = [u.producent, u.model].filter(Boolean).join(' ') + (u.lokalizacja ? ' — ' + u.lokalizacja : '');
  if(!confirm('Usunąć ten wpis?\n' + opis)) return;
  state.urzadzenia = state.urzadzenia.filter(x => x.id !== id);
  persistLocalUrzadzenia();
  render();
  if(isLocalOnlyId(id)) return;
  try{
    const res = await apiPost({action:'delete_urzadzenie', id});
    if(!res.ok) throw new Error(res.error || 'Błąd');
    showToast('usunięto');
  }catch(err){
    showToast('Usunięto lokalnie, ale nie na serwerze: ' + err.message, true);
  }
}

function moveEntry(id, dir){
  const idx = state.urzadzenia.findIndex(u => u.id === id);
  const newIdx = idx + dir;
  if(idx < 0 || newIdx < 0 || newIdx >= state.urzadzenia.length) return;
  const arr = state.urzadzenia;
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  persistLocalUrzadzenia();
  render();
  scheduleReorderSync();
}
let reorderTimer = null;
function scheduleReorderSync(){
  clearTimeout(reorderTimer);
  reorderTimer = setTimeout(async () => {
    try{
      const ids = state.urzadzenia.filter(u => !isLocalOnlyId(u.id)).map(u => u.id);
      await apiPost({action:'reorder_urzadzenia', wizytaId: state.currentWizyta.id, orderedIds: ids});
    }catch(err){ /* kolejność i tak zostaje lokalnie, spróbuje się przy następnej zmianie */ }
  }, 700);
}

async function finishProtocol(){
  if(buildRetryQueue().length){
    showToast('Synchronizuję pozostałe wpisy…');
    await retryAllUnsynced();
    if(buildRetryQueue().length){
      alert('Nie udało się zsynchronizować wszystkich wpisów (brak połączenia). Spróbuj ponownie, gdy będzie zasięg.');
      return;
    }
  }
  const w = state.currentWizyta;
  if(!confirm('Zakończyć protokół "' + w.klient + ' — ' + w.obiekt + '"?\nWizyta trafi do Archiwum, dane przestaną być edytowalne.')) return;
  try{
    const res = await apiPost({action:'finish_wizyta', id: w.id});
    if(!res.ok) throw new Error(res.error || 'Błąd');
    try{ localStorage.removeItem(lsKey(w.id)); }catch(e){}
    showToast('Protokół zakończony');
    openStart();
  }catch(err){
    showToast('Nie udało się zakończyć: ' + err.message, true);
  }
}

function buildWorkbook(){
  const w = state.currentWizyta;
  const rows = [
    ['Klient', w.klient || ''],
    ['Obiekt', w.obiekt || ''],
    ['Data', fmtDate(w.dataUtworzenia)],
    [],
    ['Lp', 'Lokalizacja', 'Typ', 'Producent', 'Model', 'SN', 'Czynnik', 'Suma czynnika (kg)', 't CO₂-eq', 'CRO', 'Uwagi']
  ];
  state.urzadzenia.forEach((u, i) => {
    const info = isZewTyp(u.typ) ? co2eqInfo(u) : null;
    rows.push([
      i + 1, u.lokalizacja || '', typLabel(u.typ), u.producent || '', u.model || '', u.sn || '',
      info ? normalizeCzynnik(u.czynnik) : '',
      info ? parseFloat(info.suma.toFixed(2)) : '',
      (info && info.tco2e != null) ? parseFloat(info.tco2e.toFixed(2)) : '',
      (info && info.cro != null) ? (info.cro ? 'W CRO' : 'Poza CRO') : '',
      u.uwagi || ''
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:4},{wch:16},{wch:12},{wch:14},{wch:16},{wch:16},{wch:10},{wch:12},{wch:10},{wch:10},{wch:34}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Urządzenia');
  return wb;
}
function exportFileName(){
  const w = state.currentWizyta;
  return sanitizeFileName(w.klient) + '_' + sanitizeFileName(w.obiekt) + '.xlsx';
}
function downloadExcel(){
  if(!state.urzadzenia.length){ showToast('Brak urządzeń do eksportu', true); return; }
  XLSX.writeFile(buildWorkbook(), exportFileName());
}
async function shareExcel(){
  if(!state.urzadzenia.length){ showToast('Brak urządzeń do eksportu', true); return; }
  const wbout = XLSX.write(buildWorkbook(), {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const file = new File([blob], exportFileName(), {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({ files:[file], title: exportFileName(), text: state.currentWizyta.klient + ' — ' + state.currentWizyta.obiekt });
    }catch(err){
      if(err.name !== 'AbortError') showToast('Nie udało się udostępnić: ' + err.message, true);
    }
  } else {
    showToast('Ta przeglądarka nie obsługuje udostępniania plików — pobieram zamiast tego', true);
    downloadExcel();
  }
}

// ============ DRZEWKO PRZYPISAŃ — EKSPORT DO GRAFIKI ============
function drawRoundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}
function wrapText(ctx, text, maxWidth){
  const words = String(text).split(' ');
  const lines = [];
  let cur = '';
  words.forEach(word => {
    const test = cur ? cur + ' ' + word : word;
    if(cur && ctx.measureText(test).width > maxWidth){
      lines.push(cur);
      cur = word;
    } else {
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  return lines;
}
const TREE_FONT_BOLD = '600 13px Arial, sans-serif';
const TREE_FONT_NORMAL = '12px Arial, sans-serif';
function treeNodeLines(ctx, u, isOut, maxTextWidth){
  const rows = [];
  if(isOut){
    rows.push({ text: [u.producent, u.model].filter(Boolean).join(' ') || '(bez nazwy)', bold:true });
    if(u.system) rows.push({ text: 'System ' + u.system, bold:false });
    const info = co2eqInfo(u);
    if(info && info.tco2e != null){
      rows.push({ text: normalizeCzynnik(u.czynnik) + ' ' + parseFloat(info.suma.toFixed(2)) + ' kg · ' + info.tco2e.toFixed(2) + ' tCO₂e · ' + (info.cro ? 'W CRO' : 'Poza CRO'), bold:false });
    }
  } else {
    rows.push({ text: u.lokalizacja || '(bez lokalizacji)', bold:true });
    const pm = [u.producent, u.model].filter(Boolean).join(' ');
    if(pm) rows.push({ text: pm, bold:false });
  }
  if(u.sn) rows.push({ text: 'SN ' + u.sn, bold:false });
  const out = [];
  rows.forEach(r => {
    ctx.font = r.bold ? TREE_FONT_BOLD : TREE_FONT_NORMAL;
    wrapText(ctx, r.text, maxTextWidth).forEach(line => out.push({ text: line, bold: r.bold }));
  });
  return out;
}
function drawTreeNode(ctx, x, y, w, h, lines, isOut){
  ctx.fillStyle = isOut ? '#fdeed2' : '#e4eefc';
  ctx.strokeStyle = isOut ? '#c98a2b' : '#3f74b8';
  ctx.lineWidth = 1.5;
  drawRoundRect(ctx, x, y, w, h, 9);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#1a1f24';
  ctx.textBaseline = 'top';
  const pad = 10, lineH = 17;
  let ty = y + (h - lines.length*lineH)/2 + 2;
  lines.forEach(l => {
    ctx.font = l.bold ? TREE_FONT_BOLD : TREE_FONT_NORMAL;
    ctx.fillText(l.text, x + pad, ty);
    ty += lineH;
  });
}
function buildTreeCanvas(){
  const outs = outdoorUnits();
  const unassigned = unassignedIndoor();
  if(!outs.length && !unassigned.length) return null;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  const MARGIN = 24, NODE_W_OUT = 230, NODE_W_IN = 210, BRANCH_X = 54;
  const PAD = 10, LINE_H = 17, GAP_Y = 12, GAP_GROUP = 26, TITLE_H = 34;

  const groups = outs.map(o => {
    const outLines = treeNodeLines(ctx, o, true, NODE_W_OUT - PAD*2);
    const kids = childrenOf(o.id).map(k => ({ u:k, lines: treeNodeLines(ctx, k, false, NODE_W_IN - PAD*2) }));
    const outH = Math.max(PAD*2 + outLines.length*LINE_H, 40);
    const kidHs = kids.map(k => Math.max(PAD*2 + k.lines.length*LINE_H, 40));
    const kidsTotalH = kids.length ? kidHs.reduce((a,b)=>a+b,0) + GAP_Y*(kids.length-1) : 0;
    const groupH = Math.max(outH, kidsTotalH || outH);
    return { o, outLines, kids, outH, kidHs, groupH };
  });

  const unassignedItems = unassigned.map(u => ({ u, lines: treeNodeLines(ctx, u, false, NODE_W_IN - PAD*2) }));
  const unassignedHs = unassignedItems.map(x => Math.max(PAD*2 + x.lines.length*LINE_H, 40));
  const unassignedTotalH = unassignedItems.length
    ? (24 + unassignedHs.reduce((a,b)=>a+b,0) + GAP_Y*Math.max(0, unassignedItems.length-1))
    : 0;

  let contentH = TITLE_H;
  groups.forEach(g => { contentH += g.groupH + GAP_GROUP; });
  contentH += unassignedTotalH;

  const width = MARGIN*2 + NODE_W_OUT + BRANCH_X + NODE_W_IN;
  const height = MARGIN*2 + contentH;

  const DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(width*DPR);
  canvas.height = Math.round(height*DPR);
  ctx.scale(DPR, DPR);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);

  const w = state.currentWizyta || {};
  ctx.fillStyle = '#1a1f24';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 15px Arial, sans-serif';
  ctx.fillText([w.klient, w.obiekt].filter(Boolean).join(' — '), MARGIN, MARGIN + 14);
  ctx.fillStyle = '#6b7280';
  ctx.font = '11px Arial, sans-serif';
  ctx.fillText('Przypisanie jednostek — ' + fmtDate(w.dataUtworzenia), MARGIN, MARGIN + 30);

  let y = MARGIN + TITLE_H;
  const xOut = MARGIN;
  const xIn = MARGIN + NODE_W_OUT + BRANCH_X;

  groups.forEach(g => {
    const outY = y + (g.groupH - g.outH)/2;
    drawTreeNode(ctx, xOut, outY, NODE_W_OUT, g.outH, g.outLines, true);

    if(g.kids.length){
      const kidsTotalH = g.kidHs.reduce((a,b)=>a+b,0) + GAP_Y*(g.kids.length-1);
      let kidY = y + (g.groupH - kidsTotalH)/2;
      const fromX = xOut + NODE_W_OUT;
      const fromY = outY + g.outH/2;
      g.kids.forEach((k, idx) => {
        const kh = g.kidHs[idx];
        drawTreeNode(ctx, xIn, kidY, NODE_W_IN, kh, k.lines, false);
        const toY = kidY + kh/2;
        ctx.strokeStyle = '#9aa1a8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.bezierCurveTo(fromX + BRANCH_X*0.6, fromY, xIn - BRANCH_X*0.6, toY, xIn, toY);
        ctx.stroke();
        kidY += kh + GAP_Y;
      });
    } else {
      ctx.fillStyle = '#9aa1a8';
      ctx.font = '11px Arial, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText('brak przypisanych', xIn, outY + g.outH/2);
      ctx.textBaseline = 'alphabetic';
    }
    y += g.groupH + GAP_GROUP;
  });

  if(unassignedItems.length){
    ctx.fillStyle = '#1a1f24';
    ctx.font = '700 12px Arial, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Nieprzypisane', xOut, y + 14);
    y += 24;
    unassignedItems.forEach((x, idx) => {
      const h = unassignedHs[idx];
      drawTreeNode(ctx, xOut, y, NODE_W_IN, h, x.lines, false);
      y += h + GAP_Y;
    });
  }

  return canvas;
}

    const obiekt = val('newObiekt').trim();
    const errEl = root.querySelector('#newErr');
    if(!klient || !obiekt){ errEl.textContent = 'Podaj klienta i obiekt.'; errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Tworzę…';
    try{
      const res = await apiPost({action:'create_wizyta', klient, obiekt});
      if(!res.ok) throw new Error(res.error || 'Błąd');
      await openWizytaWorkspace(res.data.id, false);
    }catch(err){
      errEl.textContent = 'Nie udało się utworzyć: ' + err.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Rozpocznij →';
    }
  });
}

async function deleteVisit(id, name){
  if(!confirm('Usunąć protokół „' + name + '” z archiwum?\n\nZniknie z appki razem ze wszystkimi zapisanymi w nim urządzeniami. Zdjęcia na Dysku Google zostaną — to kasuje tylko wpisy w appce.')) return;
  if(!confirm('Ostatnie potwierdzenie — tej operacji nie da się cofnąć. Na pewno usunąć „' + name + '”?')) return;
  try{
    const res = await apiPost({action:'delete_wizyta', id});
    if(!res.ok) throw new Error(res.error || 'Błąd');
    showToast('Usunięto z archiwum');
    await refreshWizytyDone();
  }catch(err){
    showToast('Nie udało się usunąć: ' + err.message, true);
  }
}

function driveThumbUrl(fileId, w){ return 'https://lh3.googleusercontent.com/d/' + fileId + '=w' + (w||200); }
function thumbUrlFor(u){
  if(u._localPreview) return u._localPreview;
  if(u.zdjecieFileId) return driveThumbUrl(u.zdjecieFileId, 200);
  return '';
}
function fullUrlFor(u){ return u.zdjecieUrl || u._localPreview || ''; }
function lightboxUrlFor(u){
  if(u._localPreview) return u._localPreview;
  if(u.zdjecieFileId) return driveThumbUrl(u.zdjecieFileId, 1600);
  return '';
}

function renderDevCard(u, idx, total){
  const thumb = thumbUrlFor(u);
  const thumbHtml = thumb ? '<img src="' + esc(thumb) + '" alt="">' : '📦';
  const lbUrl = lightboxUrlFor(u);
  const extUrl = fullUrlFor(u);
  const titleTxt = [u.producent, u.model].filter(Boolean).join(' ');
  const title = titleTxt ? esc(titleTxt) : '<span style="color:var(--ink-dim)">(bez modelu)</span>';
  const metaParts = [];
  if(u.sn) metaParts.push('SN ' + esc(u.sn));
  if(u.lokalizacja) metaParts.push(esc(u.lokalizacja));
  if(u.system) metaParts.push(esc(u.system));
  const meta = metaParts.length ? metaParts.join(' · ') : '—';
  const tagClass = isZewTyp(u.typ) ? 'tag out' : 'tag';
  const pending = u._synced===false ? ' <span style="color:var(--amber)" title="niezsynchronizowane">⏳</span>' : '';

  let html = '<div class="devcard">';
  if(!state.readonly){
    html += '<div class="reorder">' +
      '<button class="mv" data-dir="-1" data-id="' + esc(u.id) + '" ' + (idx===0?'disabled':'') + '>▲</button>' +
      '<button class="mv" data-dir="1" data-id="' + esc(u.id) + '" ' + (idx===total-1?'disabled':'') + '>▼</button>' +
    '</div>';
  }
  html += lbUrl
    ? '<button type="button" class="thumb lbtrigger" data-lb="' + esc(lbUrl) + '" data-ext="' + esc(extUrl) + '">' + thumbHtml + '</button>'
    : '<div class="thumb">' + thumbHtml + '</div>';
  html += '<div class="body"><div class="title">' + title + pending + '</div><div class="meta">' + meta + '</div>';
  if(u.uwagi) html += '<div class="uwagiline">📝 ' + esc(u.uwagi) + '</div>';
  html += pairInfoLine(u);
  if(u.typ) html += '<span class="' + tagClass + '">' + esc(typLabel(u.typ)) + '</span>';
  if(isZewTyp(u.typ)) html += co2eqBadgeHtml(u);
  html += '</div>';
  if(!state.readonly){
    html += '<div class="acts">' +
      '<button class="edit" data-id="' + esc(u.id) + '" title="Edytuj">✎</button>' +
      '<button class="dup" data-id="' + esc(u.id) + '" title="Duplikuj">⧉</button>' +
      '<button class="del" data-id="' + esc(u.id) + '" title="Usuń">🗑</button>' +
    '</div>';
  }
  html += '</div>';
  return html;
}

  '</div>';
  if(state.readonly){
    html += '<div class="hsub">Zakończono ' + esc(fmtDate(w.dataZakonczenia)) + ' · tylko podgląd</div>';
    html += '<div class="worktabs">' +
      '<button class="tabLista ' + (state.workTab==='lista'?'on':'') + '">Lista <span class="cbadge">' + state.urzadzenia.length + '</span></button>' +
      '<button class="tabPary ' + (state.workTab==='pary'?'on':'') + '">Pary</button>' +
    '</div>';
  } else {
    html += '<div class="worktabs">' +
      '<button class="tabDodaj ' + (state.workTab==='dodaj'?'on':'') + '">' + (editingId ? 'Edytuj' : 'Dodaj') + '</button>' +
      '<button class="tabLista ' + (state.workTab==='lista'?'on':'') + '">Lista <span class="cbadge">' + state.urzadzenia.length + '</span></button>' +
      '<button class="tabPary ' + (state.workTab==='pary'?'on':'') + '">Pary</button>' +
    '</div>';
  }
  html += '</header>';

  const activeTab = state.workTab;
  html += '<main class="app ' + (activeTab==='lista' ? 'haswb' : '') + '">';
  html += activeTab==='dodaj' ? renderDodajTabInner() : (activeTab==='pary' ? renderParyTabInner() : renderListaTabInner());
  html += '</main>';

  if(activeTab==='lista'){
    html += '<div class="bottombar">';
    if(!state.readonly) html += '<button class="secondary" id="btnGotoAdd">+ Dodaj</button>';
    else html += '<button class="secondary" id="btnReopen">🔓<span>Wznów</span></button>';
    html += '<button class="dl" id="btnDownload">⬇<span>Pobierz</span></button>';
    html += '<button class="share" id="btnShare">↗<span>Udostępnij</span></button>';
    html += '</div>';
  }
  return html;
}
function bindWorkspaceScreen(root){
  const exitBtn = root.querySelector('#btnExit'); if(exitBtn) exitBtn.addEventListener('click', exitWorkspace);
  const t1 = root.querySelector('.tabDodaj'); if(t1) t1.addEventListener('click', () => { state.workTab='dodaj'; render(); });
  const t2 = root.querySelector('.tabLista'); if(t2) t2.addEventListener('click', () => { state.workTab='lista'; render(); });
  const t3 = root.querySelector('.tabPary'); if(t3) t3.addEventListener('click', () => { state.workTab='pary'; render(); });

  const activeTab = state.workTab;
  if(activeTab==='dodaj') bindDodajTab(root);
  else if(activeTab==='pary') bindParyTab(root);
  else bindListaTab(root);

  const dl = root.querySelector('#btnDownload'); if(dl) dl.addEventListener('click', downloadExcel);
  const sh = root.querySelector('#btnShare'); if(sh) sh.addEventListener('click', shareExcel);
  const addBtn = root.querySelector('#btnGotoAdd'); if(addBtn) addBtn.addEventListener('click', () => { state.workTab='dodaj'; render(); });
  const reopenBtn = root.querySelector('#btnReopen'); if(reopenBtn) reopenBtn.addEventListener('click', reopenCurrentWizyta);
}

async function reopenCurrentWizyta(){
  const w = state.currentWizyta;
  if(!confirm('Wznowić edycję protokołu „' + w.klient + ' — ' + w.obiekt + '"?\nWróci do "Wizyty w toku" — będziesz mógł go znów edytować i zakończyć ponownie, gdy skończysz poprawki.')) return;
  try{
    const res = await apiPost({action:'reopen_wizyta', id: w.id});
    if(!res.ok) throw new Error(res.error || 'Błąd');
    showToast('Wznowiono do edycji');
    state.readonly = false;
    state.currentWizyta = Object.assign({}, w, { status:'w_toku', dataZakonczenia:'' });
    state.workTab = 'lista';
    persistLocalUrzadzenia();
    render();
  }catch(err){
    showToast('Nie udało się wznowić: ' + err.message, true);
  }
}

function render(){
  const app = document.getElementById('app');
  if(state.screen==='start'){ app.innerHTML = renderStartScreen(); bindStartScreen(app); }
  else if(state.screen==='wizyty'){ app.innerHTML = renderWizytyScreen(); bindListScreen(app); }
  else if(state.screen==='archiwum'){ app.innerHTML = renderArchiwumScreen(); bindListScreen(app); }
  else if(state.screen==='workspace'){ app.innerHTML = renderWorkspaceScreen(); bindWorkspaceScreen(app); }
}

// ============ START ============
resetForm();
openStart();
</script>
